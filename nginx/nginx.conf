upstream vitalforge-weight {
    server 127.0.0.1:8085;
}

upstream vitalforge-dashboard {
    server 127.0.0.1:8086;
}

server {
    listen 80;
    server_name weight.yourdomain.com;

    location / {
        proxy_pass http://vitalforge-weight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dashboard.yourdomain.com;

    location / {
        proxy_pass http://vitalforge-dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FIT activity uploads: nginx's default client_max_body_size (1MB) would
    # reject legitimate multi-MB FIT files well under the app-level cap
    # (fit_import.MAX_UPLOAD_BYTES, 20MB by default). Scoped to the import
    # route rather than raised globally so other endpoints keep the
    # conservative default.
    location /api/import/ {
        proxy_pass http://vitalforge-dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }
}
