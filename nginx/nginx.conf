# Content-Security-Policy, Report-Only: violations are logged in the browser
# console but nothing is blocked. No 'unsafe-inline' and no nonces: inline
# <script>/<style>/on*= handlers are expected to be reported until they are
# moved to static files. Switch to Content-Security-Policy (enforce) only after
# a clean week with no reports. script-src pins the exact SRI-pinned chart.js
# path, not the whole jsdelivr host.
# The header lives inside each server block (not http level) so it does not
# leak to other virtual hosts. nginx only inherits add_header when the inner
# level declares none: do not add add_header to a location block here without
# repeating the CSP line, or the policy silently disappears for that location.
# The same rule works in the other direction: because each server block now
# declares add_header, any http-level add_header (HSTS, X-Frame-Options, etc.)
# is NOT inherited by these server blocks. If you set such headers at http
# level, repeat them in each server block here. (Newer nginx also offers
# `add_header_inherit merge`; check that your version supports it.)

upstream vitalforge-weight {
    server 127.0.0.1:8085;
}

upstream vitalforge-dashboard {
    server 127.0.0.1:8086;
}

server {
    listen 80;
    server_name weight.yourdomain.com;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/chart.js@4.5.1; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://vitalforge-weight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dashboard.yourdomain.com;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/chart.js@4.5.1; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://vitalforge-dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FIT activity uploads: nginx's default client_max_body_size (1MB) would
    # reject legitimate multi-MB FIT files well under the app-level cap
    # (fit_import.MAX_UPLOAD_BYTES, 20MB by default). Scoped to the import
    # route rather than raised globally so other endpoints keep the
    # conservative default.
    location /api/import/ {
        proxy_pass http://vitalforge-dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }
}
